<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode Problems</title>
    <link rel="stylesheet" href="leetcode.css">
    <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/prismjs/plugins/line-numbers/prism-line-numbers.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
    <h1>LeetCode Questions</h1>
    <div id="result" class="container"></div>
    <div id="editor"></div>
    <button onclick="loadData()">Loading Leetcode</button>
    <button onclick="saveIntuition()">Save</button>
    <script>
        function loadData(){
            fetch('/graphql',{
                method : 'POST',
                headers : {
                    'Content-Type': 'application/json',
                },
                body : JSON.stringify({
                    query: `
                        query{
                            getAllProblems {
                                id
                                platformName
                                questionName
                                questionId
                                difficulty
                                link
                                intuition
                                code
                            }
                        }
                    `
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Full Data",data);
                if(data.data){
                    let problems = data.data.getAllProblems;
                    let output ="";
                    problems.forEach(p =>{
                        output += `
                        <div class="leetcode_card">
                            <h2 class="title">${p.questionName}</h2>

                            <div class="meta">
                                <span class="leetcode_platform">${p.platformName}</span>
                                <span class="difficulty ${p.difficulty.toLowerCase()}">${p.difficulty}</span>
                            </div>

                            <div class="intuition_block">
                                <div class="intuition_header">▶ Intuition</div>
                                <div class="intuition_content">
                                    ${p.intuition.split('\n').map(line => {
                                        line = line.trim();

                                        if (line === "") return ""; // 🚀 skip empty lines

                                        if (line.toLowerCase().includes("o(")) {
                                            return `<div class="tag complexity">⚡ ${line}</div>`;
                                        } else if (line.toLowerCase().includes("instead")) {
                                            return `<div class="highlight">${line}</div>`;
                                        } else if (line.length < 50) {
                                            return `<div class="point">${line}</div>`;
                                        } else {
                                            return `<p>${line}</p>`;
                                        }
                                    }).join('')}
                                </div>
                            </div>

                            <div class="code_block">
                                <div class="code_header">💻 Code</div>
                                <pre class="line-numbers"><code class="language-cpp">${p.code.trim().replace(/</g,"&lt;").replace(/>/g,"&gt;")}</code></pre>
                            </div>
                        </div>
                        `;
                    });
                    document.getElementById("result").innerHTML = output;
                    Prism.highlightAll();
                }
                else{
                    document.getElementById("result").innerText = "Error Occured";
                    console.error("GraphQL Error",data.errors);
                }
            })
            .catch(err => console.error("Fetched Erorr",err));
        }
    </script>
    <script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your intuition...',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'header': [1, 2, false] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['code-block']
            ]
        }
    });

    function saveIntuition() {
        const html = quill.root.innerHTML;
        console.log(html); // send this to backend
    }
    </script>
        
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
</body>
</html>
