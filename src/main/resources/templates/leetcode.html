<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode Problems</title>
</head>
<body>
    <h1>LeetCode Questions</h1>
    <div id="result"></div>
    <button onclick="loadData()">Loading Leetcode</button>
    <script>
        function loadData(){
            fetch('/graphql',{
                method : 'POST',
                headers : {
                    'Content-Type': 'application/json',
                },
                body : JSON.stringify({
                    query: `
                        query{
                            message
                        }
                    `
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("result").innerText = data.data.innerText;
            });
        }
    </script>
</body>
</html>
